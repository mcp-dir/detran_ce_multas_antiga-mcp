# Smithery configuration for DETRAN CE: Emissão de Taxa de Multas (Antiga)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_detran_ce_multas_antiga

name: detran_ce_multas_antiga-mcp
displayName: "DETRAN CE: Emissão de Taxa de Multas (Antiga)"
description: >
  DETRAN CE: Emissão de Taxa de Multas (Antiga), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_ce_multas_antiga-mcp
repository: https://github.com/mcp-dir/detran_ce_multas_antiga-mcp

tags:
  - detran_ce_multas_antiga
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_detran_ce_multas_antiga

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_detran_ce_multas_antiga/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
